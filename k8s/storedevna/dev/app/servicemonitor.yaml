apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nodeapp-app
  namespace: storefront-devna
  labels:
    app.kubernetes.io/name: nodeapp-app
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeapp-app
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
