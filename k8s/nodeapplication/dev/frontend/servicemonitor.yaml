apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nodeapp-frontend
  namespace: storefront-devhm
  labels:
    app.kubernetes.io/name: nodeapp-frontend
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nodeapp-frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
