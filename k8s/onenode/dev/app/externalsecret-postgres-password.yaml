apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nodeapp-app-postgres-password
  namespace: storefront-devan
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: deepagent-aws
    kind: ClusterSecretStore
  target:
    name: app-env
    creationPolicy: Merge
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: onenode-dev/storefront-devan/POSTGRES_PASSWORD
